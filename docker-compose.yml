services:
  mariadb:
    image: mariadb:11.2
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE:      mystuff
      MYSQL_USER:          mystuff
      MYSQL_PASSWORD:      mystuff
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test:     ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout:  5s
      retries:  5

  backend:
    build: ./backend
    ports:
      - "8056:8000"
    env_file:
      - ./backend/.env.local
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3056:3000"
    depends_on:
      - backend

volumes:
  mariadb-data:
  uploads-data:
